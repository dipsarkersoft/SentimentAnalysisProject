<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bangla News Title Checker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style></style>
  </head>



  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="card col-md-10 shadow p-4">
          <h2 class="text-center mb-4">News Sentiment Checker</h2>
  
          <form method="POST" class="text-center mb-4">
            {% csrf_token %}
            <div class="btn-group" role="group">
              <button
                class="btn btn-primary"
                type="submit"
                name="value"
                value="1"
                title="https://www.prothomalo.com/"
              >
                Prothom Alo
              </button>
  
              <button
                class="btn btn-danger"
                type="submit"
                name="value"
                value="2"
                title="https://www.bd-pratidin.com/"
              >
                Bd Protidin
              </button>
  
              <button
                class="btn btn-success"
                type="submit"
                name="value"
                value="3"
                title="https://www.kalerkantho.com/"
              >
                Kaler Kontho
              </button>
            </div>
          </form>
  
          {% if result %}
          <div class="card bg-light p-4">
            <h4 class="text-center text-success mb-3">Result</h4>
            <p><strong>Sentiment :</strong> <span class="text-primary">{{ result }}</span></p>
  
            {% if title %}
            <hr />
            <p><strong>Title : </strong> <span>{{ title }}</span></p>
            {% endif %}
  
            {% if url %}
            <hr />
            <p><strong>URL :</strong> <a href="{{ url }}" target="_blank">{{ url }}</a></p>
            {% endif %}
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </body>
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
